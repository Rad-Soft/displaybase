name: Displaybase
options:
  bundleIdPrefix: com.radsoft
  deploymentTarget:
    macOS: '15.0'
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Displaybase:
    type: application
    platform: macOS
    sources:
      - path: Displaybase
        excludes: [Info.plist]
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radsoft.displaybase
        PRODUCT_NAME: Displaybase
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Displaybase/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: $(DISPLAYBASE_IDENTITY)
        DEVELOPMENT_TEAM: $(DISPLAYBASE_TEAM)
        # DDC goes through Apple Silicon's display services
        ARCHS: arm64
  DisplaybaseTests:
    type: bundle.unit-test
    platform: macOS
    # sources are compiled in so running tests never launches the app and touches real monitors
    sources: [DisplaybaseTests, Displaybase/Core, Displaybase/Views/Shared/DeskLayout.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.radsoft.displaybase.tests
        CODE_SIGN_IDENTITY: $(DISPLAYBASE_IDENTITY)
        DEVELOPMENT_TEAM: $(DISPLAYBASE_TEAM)
schemes:
  Displaybase:
    build:
      targets:
        Displaybase: all
    test:
      targets: [DisplaybaseTests]
